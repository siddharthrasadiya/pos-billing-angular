<div class="custom-field">
  <p-floatlabel variant="on">
    <p-datepicker
      fluid
      appendTo="body"
      iconDisplay="input"
      [showIcon]="true"
      [readonlyInput]="true"
      [inputId]="id"
      [formControl]="formControlRef"
      [minDate]="minDate"
      [maxDate]="maxDate"
      [showTime]="showTime"
      hourFormat="12"
      [showClear]="showClear"
      [dateFormat]="dateFormat"
      [invalid]="!!errorText"
      (onSelect)="dateChange.emit(formControlRef.value)"
      (onClear)="dateChange.emit(null)"
    />
    <label [for]="id">
      {{ label }}
      @if (formControlRef.hasValidator(isControlRequired)) {
        <span class="required">*</span>
      }
    </label>
  </p-floatlabel>
  @if (errorText) {
    <small class="field-error">{{ errorText }}</small>
  }
</div>
