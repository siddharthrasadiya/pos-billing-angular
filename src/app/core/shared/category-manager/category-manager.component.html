<form class="card" (submit)="$event.preventDefault(); save()">
  <custom-input
    [label]="editing() ? 'Rename category' : 'New category'"
    [formControlRef]="name"
    [maxlength]="24"
  />
  <div class="row">
    @if (editing()) {
      <button type="button" class="secondary" (click)="cancelEdit()">Cancel</button>
    }
    <button type="submit">{{ editing() ? 'Save' : 'Add category' }}</button>
  </div>
</form>

@for (category of categories(); track category.id) {
  <div class="list-row" [class.selected]="editing()?.id === category.id">
    <div>
      <b>{{ category.name }}</b>
      <small>{{ usage()(category) }} {{ itemLabel() }}</small>
    </div>
    <div class="actions">
      <button
        type="button"
        class="secondary icon-btn"
        title="Rename"
        aria-label="Rename"
        (click)="edit(category)"
      >
        <app-icon name="edit" />
      </button>
      <button
        type="button"
        class="danger icon-btn"
        title="Delete"
        aria-label="Delete"
        (click)="delete(category)"
      >
        <app-icon name="delete" />
      </button>
    </div>
  </div>
} @empty {
  <p class="empty">No categories yet</p>
}
