<div class="month-bar">
  <button
    class="secondary icon-btn"
    title="Previous month"
    aria-label="Previous month"
    (click)="shiftMonth(-1)"
  >
    <app-icon name="back" />
  </button>
  <custom-date
    label="Month"
    view="month"
    dateFormat="MM yy"
    [formControlRef]="monthControl"
    [maxDate]="thisMonth"
    (dateChange)="setMonth($event)"
  />
  <button
    class="secondary icon-btn next"
    title="Next month"
    aria-label="Next month"
    [disabled]="isThisMonth()"
    (click)="shiftMonth(1)"
  >
    <app-icon name="back" />
  </button>
</div>

<div class="stats">
  <div class="stat">
    <small>Bills</small><b>{{ summary().count }}</b>
  </div>
  <div class="stat">
    <small>Total</small><b>{{ money(summary().total) }}</b>
  </div>
  <div class="stat" [class.low]="summary().due > 0">
    <small>Due</small><b>{{ money(summary().due) }}</b>
  </div>
</div>

@for (group of groups(); track group.day) {
  <div class="day">
    <div class="day-head">
      <span>{{ group.label }}</span>
      <b>{{ money(group.total) }}</b>
    </div>
    @for (bill of group.bills; track bill.id) {
      <button class="bill" (click)="selectedId.set(bill.id)">
        <span class="info">
          <b>{{ bill.no }}</b>
          <small>{{ bill.date | customDatetime: { get: 'time12' } }}</small>
        </span>
        <span class="amount">
          <b [class.struck]="bill.status === BillStatus.Cancelled">{{ money(bill.total) }}</b>
          <span class="status-pill {{ bill.status }}">{{ statusLabels[bill.status] }}</span>
        </span>
      </button>
    }
  </div>
} @empty {
  <p class="empty">{{ loading() ? 'Loading…' : 'No bills in this month' }}</p>
}

<app-side-drawer [open]="!!selectedId()" title="Bill details" (closed)="selectedId.set(null)">
  <app-bill-detail [billId]="selectedId()" [shop]="shop()" (changed)="getTableData()" />
</app-side-drawer>
