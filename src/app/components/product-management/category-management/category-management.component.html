<form class="card" (submit)="$event.preventDefault(); save()">
  <label>
    {{ editing() ? 'Rename category' : 'New category' }}
    <input [formControl]="name" maxlength="24" placeholder="e.g. Snacks" />
  </label>
  <div class="row">
    @if (editing()) {
      <button type="button" class="secondary" (click)="cancelEdit()">Cancel</button>
    }
    <button type="submit">{{ editing() ? 'Save' : 'Add category' }}</button>
  </div>
</form>

@for (category of categories(); track category.id) {
  <div class="list-row" [class.selected]="editing()?.id === category.id">
    <div>
      <b>{{ category.name }}</b>
      <small>{{ productCount(category) }} products</small>
    </div>
    <div class="actions">
      <button type="button" class="secondary" (click)="edit(category)">Edit</button>
      <button type="button" class="danger" (click)="delete(category)">Delete</button>
    </div>
  </div>
} @empty {
  <p class="empty">No categories yet</p>
}
