<form class="drawer-form" [formGroup]="form" (ngSubmit)="save()">
  <custom-input label="Product name" [formControlRef]="form.controls.name" [maxlength]="32" />
  <custom-input
    label="Name in Gujarati"
    [formControlRef]="form.controls.localName"
    [maxlength]="40"
    (inputEvent)="onLocalNameInput($event)"
  />
  @if (isTranslating()) {
    <small class="hint muted">Translating to Gujarati...</small>
  } @else if (isAutoTranslated()) {
    <small class="hint muted">Auto-translated. Edit it if needed.</small>
  }
  <div class="row">
    <custom-input label="Short name" [formControlRef]="form.controls.shortName" [maxlength]="12" />
    <custom-select
      label="Category"
      [formControlRef]="form.controls.categoryId"
      [options]="categoryOptions"
      (onSelectChange)="onCategoryChange()"
    />
  </div>
  <div class="row">
    <custom-number-input label="Buy price" [formControlRef]="form.controls.buyPrice" />
    <custom-number-input label="Sell price" [formControlRef]="form.controls.sellPrice" />
  </div>
  @if (margin(); as m) {
    <p class="hint" [class.low]="m.loss">{{ m.text }}</p>
  }
  <custom-number-input
    label="Stock"
    [formControlRef]="form.controls.stock"
    [maxFractionDigits]="0"
    [min]="null"
  />
  <div class="row">
    <button type="button" class="secondary" (click)="cancel()">Cancel</button>
    <button type="submit">Save Product</button>
  </div>
</form>
