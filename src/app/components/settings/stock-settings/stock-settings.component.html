<form class="card" [formGroup]="form" (ngSubmit)="save()">
  <h2>History to keep</h2>
  <small>
    Per product, {{ minLimit }} to {{ maxLimit }}. Older entries are deleted permanently, which
    keeps backups small and fast.
  </small>
  <div class="row">
    <custom-number-input
      label="Selling price changes"
      [formControlRef]="form.controls.priceHistoryLimit"
      [maxFractionDigits]="0"
      [min]="minLimit"
      [max]="maxLimit"
    />
    <custom-number-input
      label="Stock movements"
      [formControlRef]="form.controls.movementHistoryLimit"
      [maxFractionDigits]="0"
      [min]="minLimit"
      [max]="maxLimit"
    />
  </div>

  <button type="submit">Save</button>
</form>
